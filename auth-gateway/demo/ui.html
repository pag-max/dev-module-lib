<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Auth Gateway · 登录页</title>
  <link rel="stylesheet" href="../../ui-kit/theme.css">
  <style>
    body { font-family: var(--font); background: var(--bg); color: var(--text); margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { width: 340px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 28px; box-shadow: var(--shadow-lg); }
    .card h2 { text-align: center; margin: 0 0 4px; }
    .card .sub { text-align: center; color: var(--text-3); font-size: 12px; margin-bottom: 20px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 4px; text-align: center; }
    .input { width: 100%; text-align: center; }
    .btn-primary { width: 100%; padding: 10px; }
    .alert { display: none; background: var(--danger-soft); color: var(--danger); border: 1px solid var(--danger); padding: 8px 12px; border-radius: var(--radius-s); font-size: 13px; margin-bottom: 14px; }
    .alert.show { display: block; }
    .logged { display: none; text-align: center; }
    .logged.show { display: block; }
    .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--success); margin-right: 6px; }
  </style>
</head>
<body>
  <div class="card">
    <div id="loginView">
      <h2>登录</h2>
      <div class="sub">交大 SSO / AcFun 网关 通用登录模板</div>
      <div class="alert" id="alert">账号或密码错误</div>
      <div class="form-group"><label>账号</label><input class="input" id="user" placeholder="学号 / 邮箱"></div>
      <div class="form-group"><label>密码</label><input class="input" type="password" id="pwd" placeholder="••••••"></div>
      <button class="btn btn-primary" id="loginBtn">登录</button>
    </div>
    <div class="logged" id="loggedView">
      <h2>已登录</h2>
      <p style="margin:18px 0"><span class="status-dot"></span><b id="who">user</b> 的会话有效</p>
      <button class="btn" id="logoutBtn">退出登录</button>
    </div>
  </div>
  <script>
    // 这里演示接法：真实项目把 login 换成 AuthGateway.login(fn)
    // 伪造校验：账号非空且密码 !== '0' 即成功
    document.getElementById('loginBtn').onclick = () => {
      const u = document.getElementById('user').value.trim();
      const p = document.getElementById('pwd').value;
      if (!u || p === '0') { document.getElementById('alert').classList.add('show'); return; }
      document.getElementById('alert').classList.remove('show');
      document.getElementById('who').textContent = u;
      document.getElementById('loginView').style.display = 'none';
      document.getElementById('loggedView').classList.add('show');
    };
    document.getElementById('logoutBtn').onclick = () => {
      document.getElementById('loggedView').classList.remove('show');
      document.getElementById('loginView').style.display = 'block';
      document.getElementById('pwd').value = '';
    };
  </script>
</body>
</html>
