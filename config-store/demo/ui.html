<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Config Store · 设置页</title>
  <link rel="stylesheet" href="../../ui-kit/theme.css">
  <style>
    body { font-family: var(--font); background: var(--bg); color: var(--text); margin: 0; padding: 24px; }
    .wrap { max-width: 820px; margin: 0 auto; display: flex; gap: 24px; }
    .side { width: 160px; flex-shrink: 0; }
    .side .g { font-size: 11px; color: var(--text-3); text-transform: uppercase; margin: 12px 0 6px; }
    .side .i { padding: 7px 10px; border-radius: var(--radius-s); cursor: pointer; color: var(--text-2); }
    .side .i.active, .side .i:hover { background: var(--accent-soft); color: var(--accent); }
    .panel { flex: 1; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
    .card h3 { margin: 0 0 12px; font-size: 14px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 4px; }
    .input { width: 100%; }
    .form-row { display: grid; grid-template-columns: 130px minmax(160px, 220px) 1fr; align-items: center; gap: 12px; margin-bottom: 12px; }
    .form-row > label { font-size: 12px; color: var(--text-2); }
    .form-row > .hint { font-size: 11px; color: var(--text-3); }
    .form-row > .switch { justify-self: start; }
    .hint { font-size: 11px; color: var(--text-3); }
  </style>
</head>
<body>
  <div class="wrap">
    <aside class="side">
      <div class="g">分组</div>
      <div class="i active" data-g="general">通用</div>
      <div class="i" data-g="download">下载</div>
      <div class="i" data-g="advanced">高级</div>
    </aside>
    <main class="panel">
      <div class="card" data-card="general">
        <h3>通用</h3>
        <div class="form-group"><label>应用名称</label><input class="input" id="f-name" value="我的工具"></div>
        <div class="form-row">
          <label>保存路径</label>
          <input class="input" id="f-path" value="D:/Downloads">
          <button class="btn btn-sm" style="justify-self:start">选择…</button>
        </div>
        <div class="form-row">
          <label>开机自启</label>
          <label class="switch"><input type="checkbox" id="f-auto" checked><span></span></label>
          <span></span>
        </div>
      </div>
      <div class="card" data-card="download" hidden>
        <h3>下载</h3>
        <div class="form-row"><label>并发线程</label><input type="number" class="input" id="f-thread" value="4"><span></span></div>
        <div class="form-row"><label>速度上限 (MB/s)</label><input type="number" class="input" id="f-speed" value="0"><span class="hint">0=不限</span></div>
      </div>
      <div class="card" data-card="advanced" hidden>
        <h3>高级</h3>
        <div class="form-row"><label>保留日志份数</label><input type="number" class="input" id="f-keep" value="30"><span></span></div>
        <div class="form-group"><span class="hint">高风险项（如清空数据）需二次确认，不自动保存。</span></div>
        <button class="btn" style="border-color:var(--danger);color:var(--danger)">清空全部数据…</button>
      </div>
    </main>
  </div>
  <div class="toast-wrap" id="toastWrap"></div>
  <script>
    // 分组切换
    document.querySelectorAll('.side .i').forEach(it => it.onclick = () => {
      document.querySelectorAll('.side .i').forEach(x => x.classList.remove('active'));
      it.classList.add('active');
      document.querySelectorAll('.card').forEach(c => c.hidden = c.dataset.card !== it.dataset.g);
    });
    // 低利害：变更即自动保存（接 ConfigStore.set）
    ['f-name','f-path','f-auto','f-thread','f-speed','f-keep'].forEach(id => {
      document.getElementById(id).addEventListener('change', () => toast('已自动保存', 'success'));
    });
    function toast(msg, type){ const w=document.getElementById('toastWrap'); const t=document.createElement('div'); t.className='toast'+(type?' toast-'+type:''); t.textContent=msg; w.appendChild(t); setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300);},2000); }
  </script>
</body>
</html>
